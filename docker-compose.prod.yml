services:
  dragonfly:
    image: docker.dragonflydb.io/dragonflydb/dragonfly:latest
    restart: unless-stopped
    ulimits:
      memlock: -1
    volumes:
      - dragonflydata:/data
    networks:
      - tempmail

  api-server:
    image: ghcr.io/aui-tuthousend/tempmail-api-server:latest
    restart: unless-stopped
    depends_on:
      - dragonfly
    environment:
      RUST_LOG: info
      REDIS_URL: redis://dragonfly:6379
      MAILBOX_DOMAIN: intotheheap.net
      MAILBOX_TTL_SECONDS: 3600
      MAILBOX_LOCAL_PART_LENGTH: 12
      API_BIND_ADDR: 0.0.0.0:8080
      CORS_ALLOWED_ORIGINS: https://tempmail.intotheheap.net
    ports:
      - "127.0.0.1:8080:8080"
    networks:
      - tempmail

  smtp-receiver:
    image: ghcr.io/aui-tuthousend/tempmail-smtp-receiver:latest
    restart: unless-stopped
    depends_on:
      - dragonfly
    cap_add:
      - NET_BIND_SERVICE
    environment:
      RUST_LOG: info
      REDIS_URL: redis://dragonfly:6379
      QUEUE_RAW_EMAIL_STREAM: email_raw
      REDIS_CONSUMER_GROUP: email-processor
      REDIS_STREAM_BLOCK_MS: 5000
      MAILBOX_DOMAIN: intotheheap.net
      SMTP_LISTEN_ADDR: 0.0.0.0:25
      SMTP_HOSTNAME: mail.intotheheap.net
      SMTP_MAX_MESSAGE_BYTES: 10485760
      SMTP_MAX_MESSAGES_PER_CONNECTION: 20
      SMTP_ENABLE_STARTTLS: "false"
      TLS_CERT_PATH: ""
      TLS_KEY_PATH: ""
    ports:
      - "25:25"
    networks:
      - tempmail

  email-processor:
    image: ghcr.io/aui-tuthousend/tempmail-email-processor:latest
    restart: unless-stopped
    depends_on:
      - dragonfly
    environment:
      RUST_LOG: info
      REDIS_URL: redis://dragonfly:6379
      QUEUE_RAW_EMAIL_STREAM: email_raw
      REDIS_CONSUMER_GROUP: email-processor
      REDIS_STREAM_BLOCK_MS: 5000
      REDIS_CONSUMER_NAME: email-processor-1
      EMAIL_PROCESSOR_BATCH_SIZE: 10
      MESSAGE_TTL_GRACE_SECONDS: 300
      MAILBOX_DOMAIN: intotheheap.net
      MAILBOX_TTL_SECONDS: 3600
      R2_ENDPOINT: ""
      R2_BUCKET: ""
      R2_ACCESS_KEY_ID: ""
      R2_SECRET_ACCESS_KEY: ""
      R2_REGION: auto
      R2_PREFIX: attachments/
    networks:
      - tempmail

  cleanup-worker:
    image: ghcr.io/aui-tuthousend/tempmail-cleanup-worker:latest
    restart: unless-stopped
    depends_on:
      - dragonfly
    environment:
      RUST_LOG: info
      REDIS_URL: redis://dragonfly:6379
      CLEANUP_INTERVAL_SECONDS: 60
      CLEANUP_BATCH_SIZE: 100
      R2_ENDPOINT: ""
      R2_BUCKET: ""
      R2_ACCESS_KEY_ID: ""
      R2_SECRET_ACCESS_KEY: ""
      R2_REGION: auto
      R2_PREFIX: attachments/
    networks:
      - tempmail

  frontend:
    image: ghcr.io/aui-tuthousend/tempmail-frontend:latest
    restart: unless-stopped
    depends_on:
      - api-server
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
    ports:
      - "127.0.0.1:3000:3000"
    networks:
      - tempmail

networks:
  tempmail:
    driver: bridge

volumes:
  dragonflydata:
